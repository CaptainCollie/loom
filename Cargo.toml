[package]
name = "loom"
version = "0.1.0"
edition = "2024"
authors = ["Artur (@CaptainCollie)"]
description = "Tool to create nested file and directory structures."
repository = "https://github.com/CaptainCollie/loom"
readme = "README.md"
license = "Apache-2.0"
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.9", features = [
    "color",
    "suggestions",
    "unicode",
    "wrap_help",
    "help",
    "usage",
    "cargo",
] }
crossterm = "0.29.0"
ratatui = { version = "0.30.2", features = ["crossterm"] }
