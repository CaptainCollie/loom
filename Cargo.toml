[package]
name = "loom"
version = "0.1.0"
edition = "2024"
authors = ["Artur (@CaptainCollie)"]
description = "Tool to create nested file and directory structures."
repository = "https://github.com/CaptainCollie/loom"
readme = "README.md"
license = "Apache-2.0"
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.9", features = [
    "color",
    "suggestions",
    "unicode",
    "wrap_help",
    "help",
    "usage",
    "cargo",
] }
crossterm = "0.29.0"
ratatui = { version = "0.30.2", features = ["crossterm"] }
unicode-width = "0.2.3"
unicode-segmentation = "1.13.3"
devicons = "0.6.13"
dirs = "7.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "9.8.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
json5 = { version = "1.3.8", default-features = false }
usvg = { version = "0.50.0", default-features = false }
roxmltree = "0.21.2"
simplecss = "0.2.2"
